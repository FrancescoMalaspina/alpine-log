# Deploys the Supabase Edge Functions (supabase/functions/) to the hosted
# project, and keeps the Gemini key in Supabase's secret store up to date.
#
# One-time setup in the repository settings:
#   Settings → Secrets and variables → Actions → Secrets:
#     SUPABASE_ACCESS_TOKEN  personal access token of the account that owns the
#                            project (supabase.com → Account → Access Tokens)
#     GEMINI_API_KEY         optional: when set, copied to the project's Edge
#                            Function secrets on every run
#   Variables: VITE_SUPABASE_URL (already set for the Pages deploy) gives the
#   project ref.
name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        id: project
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # https://<ref>.supabase.co → <ref>
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https://([a-z0-9]+)\.supabase\.co/?$#\1#')
          if [ -z "$ref" ] || [ "$ref" = "$SUPABASE_URL" ]; then
            echo "::error::The VITE_SUPABASE_URL variable must look like https://<project-ref>.supabase.co"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Update the Gemini key
        if: env.GEMINI_API_KEY != ''
        run: supabase secrets set --project-ref "${{ steps.project.outputs.ref }}" GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Deploy
        run: supabase functions deploy --use-api --project-ref "${{ steps.project.outputs.ref }}"
