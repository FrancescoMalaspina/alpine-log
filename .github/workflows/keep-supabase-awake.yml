# Free Supabase projects pause after about a week without activity. A tiny
# read twice a week keeps the hosted database awake. Uses the same public
# variables as the deploy workflow.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4'   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one place
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail --silent --show-error "$URL/rest/v1/places?select=id&limit=1" -H "apikey: $KEY"
